[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "respepbind"
version = "0.0.1"
description = "ResPepBind peptide-protein interaction predictor"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Protein-peptide interactions :: BioInformatics",
  "Operating System :: OS Independent",
]
dependencies = [
  "torch>=2.2,<3",
  "numpy>=1.24,<2",
  "scikit-learn>=1.3,<2",
  "transformers>=4.38,<4.50",
  "sentencepiece>=0.1.99",
  "safetensors>=0.4",
  "protobuf>=4.25,<6",
]

[project.scripts]
respepbind = "respepbind.predict:main"
respepbind-download-weights = "respepbind.weights:main"

[project.urls]
Repository = "https://github.com/Arslan-Siraj/ResPepBind"
Weights = "https://github.com/Arslan-Siraj/ResPepBind/releases/tag/ResPepBind_model_v1.0.0_seed2026_10fold"

[tool.setuptools]
packages = ["respepbind"]
