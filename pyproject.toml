
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "respepbind"
version = "0.0.1"
description = "ResPepBind: A deep learning predictor of peptide-protein binding interactions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Arslan Siraj", email = "arslan.qau11@gmail.com" },
    { name = "Sabir Ali", email = "Sabirkhokhar110@gmail.com" }
]

maintainers = [
    { name = "Arslan Siraj", email = "arslan.qau11@gmail.com" },
    { name = "Sabir Ali", email = "Sabirkhokhar110@gmail.com" }
]

keywords = [
    "peptide-protein interactions",
    "peptide binding",
    "protein language models",
    "ProtT5",
    "deep learning",
    "bioinformatics",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.2,<3",
    "numpy>=1.24,<2",
    "scikit-learn>=1.3,<2",
    "transformers>=4.38,<4.50",
    "sentencepiece>=0.1.99",
    "safetensors>=0.4",
    "protobuf>=4.25,<6",
]

[project.scripts]
respepbind = "respepbind.predict:main"
respepbind-download-weights = "respepbind.weights:main"

[project.urls]
Repository = "https://github.com/Arslan-Siraj/ResPepBind"
Documentation = "https://github.com/Arslan-Siraj/ResPepBind#readme"
Issues = "https://github.com/Arslan-Siraj/ResPepBind/issues"
Weights = "https://github.com/Arslan-Siraj/ResPepBind/releases/tag/ResPepBind_model_v1.0.0_seed2026_10fold"

[tool.setuptools]
packages = ["respepbind"]
